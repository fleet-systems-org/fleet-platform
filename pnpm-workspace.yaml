packages:
  - packages/*
  - prototypes/*

allowBuilds:
  # Not needed: the agent-browser wrapper marks its bundled binary executable; ssh2/cpu-features
  # fall back to JavaScript; protobufjs only prints a notice.
  agent-browser: false
  cpu-features: false
  protobufjs: false
  ssh2: false
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - postcss@8.5.31
